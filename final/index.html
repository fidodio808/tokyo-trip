.cd{flex:1;min-width:0;background:#fff;border:1px solid #e5e2da;border-radius:14px;padding:10px 12px;position:relative}

.bk{margin-top:8px;border:2px solid #ea580c;background:#fff7ed;border-radius:10px;padding:7px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

details.more{margin-top:6px;font-size:13px}details.more summary{color:#6b7280;cursor:pointer}details.more .f{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:4px}details.more .f i{font-style:normal;color:#6b7280}
.ph{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:6px}.cap{font-size:10.5px;color:#9ca3af}
.due{margin-top:8px;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700}

.stop::after{content:"";display:block;clear:both}

.stop.opt .sno{background:#d97706}
.sw{color:#1e40af;font-size:12.5px;margin-top:2px}
.snote{color:#4b5563;font-size:12.5px;margin-top:2px}
.shrs{color:#6b7280;font-size:12.5px;margin-top:2px}
.smap{font-size:12.5px;margin-top:3px;color:#6b7280;line-height:1.45}
.smeta{color:#6b7280;font-size:12.5px;margin-top:2px;line-height:1.45}
.lead{font-size:13.5px;margin-top:4px;line-height:1.45}
.q{color:#374151;font-size:13px;margin-top:4px;line-height:1.45}
.warn{color:#9a3412;font-size:12.5px;margin-top:3px}
.quiet{font-weight:400;font-size:11.5px;color:#9ca3af;margin-left:4px}
.nmore{display:inline}
.nmore summary{display:inline;cursor:pointer;color:#9ca3af;font-size:12px;margin-left:4px}

.stop .sn{flex-wrap:wrap}
.mpin.opt{background:#fff;color:#b45309}.mpin.skip{background:#fff7ed;color:#9a3412}

.card{flex:1;background:#eff6ff;border:2px solid #1d4ed8;border-radius:14px;padding:10px 12px}.card h3{margin:0 0 4px;font-size:16px}

.near{margin-top:14px;background:#fff;border-radius:14px;border:1px solid #e5e2da;padding:10px 12px}.near summary{font-weight:700;cursor:pointer}

.ft{font-size:11.5px;color:#9ca3af;margin-top:16px;line-height:1.6}

.op.on{border-color:#7c3aed;background:#f5f3ff}.op small{display:block;color:#6b7280;font-size:12.5px;margin-top:2px}.op .df{font-size:11px;background:#e5e7eb;border-radius:5px;padding:0 5px;margin-left:4px;color:#374151;font-weight:400}
