 const y=500+Math.ceil(Math.max(0,d/1000-1)/.232)*100;return{md:"taxi",txt:"打车或乘车（线路以 Google 为准）",min:"≈"+Math.max(5,Math.round(d/1000/20*60+3)),fare:"≈¥"+(Math.round(y/100)*100).toLocaleString(),auto:1}}
function legOf(d,i){const L=items(d),e=L[i],raw=DAYS[d].items[i];if(!raw.leg)return null;
 const toId=raw.leg.to||(L[i+1]&&L[i+1].p);if(!toId)return null;const nxtChanged=!raw.leg.to&&L[i+1]&&L[i+1].ai>0;
 const A=P[e.p],B=P[toId];const lg=(e.ai>0||nxtChanged)?autoLeg(A,B):raw.leg;return Object.assign({A,B,toN:raw.leg.to?B.n:nm(L[i+1])},lg)}
const MD={walk:["🚶","walking"],train:["🚇","transit"],taxi:["🚕","driving"]};
function legHTML(l){if(!l)return"";const[ic,mode]=MD[l.md];
 return`<div class="leg"><div class="lt">${ic} ${esc(l.txt)} · ${esc(l.min)} 分${l.fare?" · "+esc(l.fare):""}</div>${l.ex?`<div class="sub">出口/站：${esc(l.ex)}</div>`:""}${l.alt?`<div class="sub">${esc(l.alt)}</div>`:""}${l.auto?`<div class="sub">（已换选项，路程为直线估算）</div>`:""}
 <div class="la"><a href="${gdir(l.A.ll,l.B.ll,mode)}" target="_blank" rel="noopener">Google 路线 → ${esc(l.toN)} ↗</a>${l.md!=="walk"||l.auto?`<a href="${uber(l.B)}" target="_blank" rel="noopener">🚕 Uber</a><a href="${GO}" target="_blank" rel="noopener">GO 打车</a>`:""}</div></div>`}
/* limits */
function limState(d,t){const n=jpNow();const day=DAYS[d].d;let m=null;if(n.date===day)m=n.m;else{const nx=new Date(Date.parse(day+"T00:00:00+09:00")+864e5).toISOString().slice(0,10);if(n.date===nx&&n.m<360)m=n.m+1440}
 if(m==null)return"";const L=toM(t);return m>=L?"past":m>=L-30?"soon":""}
function limHTML(d,lim){return(lim||[]).map(([t,l])=>{const s=limState(d,t);return`<span class="lim ${s?"red":""}">⏱ ${esc(l)} ${fmt(toM(t))}${s==="past"?" · 已过":s==="soon"?" · 快到了":""}</span>`}).join("")}
function bkHTML(e){if(!e.bk)return"";const key="bk."+e.k+"."+e.p,v=LS.g(key,{d:0,s:""});
 return`<div class="bk ${v.d?"done":""}"><span class="bl">${e.bk==="must"?"🎫 必须预约":"🎫 建议预约"} · ${esc(e.bkl||"")}</span><button onclick="togBk('${key}')">${v.d?"已订 ✓":"未订"}</button><input placeholder="预约时段，如 17:00" value="${esc(v.s)}" onchange="setBkS('${key}',this.value)"></div>`}
function togBk(k){const v=LS.g(k,{d:0,s:""});v.d=v.d?0:1;LS.s(k,v);render()}
function setBkS(k,s){const v=LS.g(k,{d:0,s:""});v.s=s;LS.s(k,v)}
function moreHTML(p){const f=(p.info&&p.info.f)||[];const ac=p.acc?`${p.acc.s}${p.acc.e?" "+p.acc.e+"出口":""}${p.acc.m!=null?" · 步行"+p.acc.m+"分":""}${p.acc.nt?"（"+p.acc.nt+"）":""}`:"";
 return`<details class="more"><summary>详情 · 地址 · 导航</summary>${p.ph&&p.ph[0]?`<img class="ph" loading="lazy" src="${p.ph[0][0]}" alt=""><div class="cap">${esc(p.ph[0][1])}</div>`:""}
 ${p.d?`<div style="margin-top:4px">${esc(p.d)}</div>`:""}${p.note?`<div style="color:#b45309">⚠ ${esc(p.note)}</div>`:""}<div class="f">${f.map(x=>`<i>${esc(x[0])}</i><span>${esc(x[1])}</span>`).join("")}${ac?`<i>车站</i><span>${esc(ac)}</span>`:""}${p.pr?`<i>人均</i><span>${esc(p.pr)}</span>`:""}${p.rsv?`<i>预约</i><span>${esc(p.rsv.s)} ${p.rsv.l.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}↗</a>`).join(" ")}</span>`:""}</div>
 <div style="margin-top:4px">📍 ${esc(p.a||"—")} · <a href="${gm(p)}" target="_blank" rel="noopener">Google Maps ↗</a></div></details>`}
function arriveCard(){return`<div class="card"><h3>✈️ 抵达 · CA181 羽田 12:50</h3><div style="font-size:13px">落地羽田第3航站楼（国际线）→ 入境、取行李 → 去五反田酒店放行李（目标 ~14:30）。</div>
 <div style="font-size:12.5px;color:#6b7280;margin-top:4px">路线见下方（京急+JR 或打车）。</div></div></div>`}
function airportCard(d){const H=P.hotel,A=P.hnd;const ls=t=>limHTML(d,[[t,"最晚出发"]]);
 return`<div class="card ap" id="airport"><h3>🧳 去机场 · 羽田 T3 · CA422 21:00</h3><div style="font-size:13px">16:00–16:30 酒店取行李 → <b>18:00 前到羽田第3航站楼</b>（国际线建议起飞前 3 小时）。周日傍晚可能堵车，宁早勿晚。</div>
 <div class="rt"><b>A · 🚕 打车</b> ≈30–40 分 · ≈¥7,000–9,000<div class="bdg">${ls("17:15")}</div><div class="leg" style="margin:4px 0 0;border:0;padding:0"><div class="la"><a href="${gdir(H.ll,A.ll,"driving")}" target="_blank" rel="noopener">Google 路线 ↗</a><a href="${uber(A)}" target="_blank" rel="noopener">🚕 Uber</a><a href="${GO}" target="_blank" rel="noopener">GO 打车</a></div></div></div>
 <div class="rt"><b>B · 🚇 JR + 京急（经品川）</b><br>JR 山手线 五反田→品川 ≈5 分，换京急空港线（快特/急行）→ 羽田空港第3航站楼站 ≈15 分 · 全程 ≈40 分 · ≈¥500<div class="bdg">${ls("17:15")}</div></div>
 <div class="rt"><b>C · 🚝 JR + 东京单轨（经浜松町）</b><br>JR 山手线 五反田→浜松町 ≈10 分，换东京单轨电车 → 羽田空港第3航站楼站 ≈15 分 · 全程 ≈45 分 · ≈¥700<div class="bdg">${ls("17:05")}</div>
 <div class="leg" style="margin:4px 0 0;border:0;padding:0"><div class="la"><a href="${gdir(H.ll,A.ll,"transit")}" target="_blank" rel="noopener">Google 公交路线 ↗</a></div></div></div>
 <div class="ft" style="margin-top:6px">时间/票价为估算（≈），以 Google 和现场为准。最晚出发 = 18:00 到达 − 路程 − 约 15–20 分余量。</div></div>`}
/* mini map (static GSI tiles) */
function miniMap(d){const L=items(d);const pts=[];L.forEach((e,i)=>{if(e.p==="hnd")return;const p=P[e.p];pts.push({i:i+1,ll:p.ll,h:e.p==="hotel"})});
 const W=Math.min(536,document.documentElement.clientWidth-48),H=200;
 const px=(ll,z)=>{const s=256*2**z,x=(ll[1]+180)/360*s,r=ll[0]*Math.PI/180;return[x,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s]};
 let z=16,b;for(;z>10;z--){const xy=pts.map(p=>px(p.ll,z));const xs=xy.map(a=>a[0]),ys=xy.map(a=>a[1]);b=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];if(b[2]-b[0]<W-40&&b[3]-b[1]<H-40)break}
 const cx=(b[0]+b[2])/2-W/2,cy=(b[1]+b[3])/2-H/2;let h="";
 for(let tx=Math.floor(cx/256);tx*256<cx+W;tx++)for(let ty=Math.floor(cy/256);ty*256<cy+H;ty++)h+=`<img class="t" alt="" src="https://cyberjapandata.gsi.go.jp/xyz/pale/${z}/${tx}/${ty}.png" style="left:${tx*256-cx}px;top:${ty*256-cy}px">`;
 const sp=pts.map(p=>{const q=px(p.ll,z);return[q[0]-cx,q[1]-cy]});
 h+=`<svg width="${W}" height="${H}"><polyline points="${sp.map(a=>a.join(",")).join(" ")}" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/></svg>`;
 const put=[];pts.forEach((p,j)=>{let[x,y]=sp[j];let g=0;while(put.some(q=>Math.hypot(q[0]-x,q[1]-y)<20)&&g<12){const a=g*2.1;x=sp[j][0]+Math.cos(a)*22*(1+g/6);y=sp[j][1]+Math.sin(a)*22*(1+g/6);g++}put.push([x,y]);h+=`<div class="pin ${p.h?"h":""}" style="left:${x}px;top:${y}px">${p.h?"🏨":p.i}</div>`});
 const ids=pts.map(p=>p.ll.join(","));const u=`https://www.google.com/maps/dir/${ids.slice(0,10).join("/")}`;
 return`<div class="mm" style="width:${W}px">${h}<div class="at">地图：国土地理院</div></div><div class="mlinks"><span style="color:#6b7280">数字 = 时间轴顺序${d===0?"（机场未画）":""}</span><a href="${u}" target="_blank" rel="noopener">全天路线 Google ↗</a></div>`}
/* now bar */
const TRIP0=Date.parse("2026-11-27T12:50:00+09:00");
function curPos(){const n=jpNow();const d=DAYS.findIndex(x=>x.d===n.date);if(d<0)return{n,d};const L=items(d);let c=-1;L.forEach((e,i)=>{if(toM(e.t)<=n.m)c=i});return{n,d,c,L}}
function nowBar(){const r=curPos(),n=r.n;const t=`东京 ${fmt(n.m)}`;let h;
 if(r.d<0){if(n.ts<TRIP0){const s=(TRIP0-n.ts)/1e3,dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600);const e=items(0)[0];
   h=`<span class="tag">倒计时</span>距落地羽田还有 <b>${dd} 天 ${hh} 小时</b> <span style="color:#94a3b8">· ${t}</span><div class="nl">Day 1 首站：${e.t} ${esc(nm(e))} · 之后 ${items(0)[1].t} 到酒店放行李</div>`}
  else h=`<span class="tag">完成</span>行程已结束 · ${t}`}
 else{const L=r.L,c=r.c;if(c<0){const e=L[0];h=`<span class="tag">今天</span>${DAYS[r.d].tab} · ${t}<div class="nl">首站 ${e.t} ${esc(nm(e))}</div>`}
  else{const e=L[c],x=L[c+1],lg=legOf(r.d,c);const ic=lg?MD[lg.md][0]:"";
   h=`<span class="tag">现在</span><b>${esc(nm(e))}</b> <span style="color:#94a3b8">· ${t}</span><div class="nl">${x?`下一站 ${x.t} ${esc(nm(x))}${lg?` · ${ic} ${esc(lg.txt)} ${esc(lg.min)} 分`:""}`:(r.d===2?"下一步：去机场（见卡片）":"今天结束，回酒店")}</div>`}}
 $("#now").innerHTML=h;$("#now").onclick=()=>{if(r.d>=0){setDay(r.d);const el=document.getElementById("it-"+(r.c<0?0:r.c));el&&el.scrollIntoView({behavior:"smooth",block:"center"})}else setDay(0)}}
/* alt sheet */
function openSh(d,i){const it=DAYS[d].items[i],cur=LS.g("alt."+it.k,0);const opts=[{p:it.p,n:it.n,why:"默认安排",note:it.note}].concat(it.alts);
 $("#sp").innerHTML=`<button class="x" onclick="closeSh()">✕</button><h3>${it.t} · 可替换</h3><div style="font-size:12.5px;color:#6b7280">选一个，时间轴会换成它（会记住）</div>`+opts.map((o,j)=>`<button class="op ${j===cur?"on":""}" onclick="pick('${it.k}',${j})"><b>${esc(o.n||P[o.p].n)}</b>${j===0?'<span class="df">默认</span>':""}${j===cur?" ✓":""}<small>${j===0?"默认："+esc(it.note||""):"何时换："+esc(o.why)}</small></button>`).join("");
 $("#sh").classList.add("on")}
function closeSh(){$("#sh").classList.remove("on")}
function pick(k,j){LS.s("alt."+k,j);closeSh();render()}
/* render */
let DAY=LS.g("day",null);
function setDay(d){DAY=d;LS.s("day",d);render();scrollTo(0,0)}
const CI={walk:"🌲 逛",food:"☕ 咖啡",dine:"🍜 吃",shop:"🛍 店",stay:"🏨"};
function render(){const r=curPos();if(DAY==null)DAY=r.d>=0?r.d:0;const d=DAY,D=DAYS[d],L=items(d);
 $("#tabs").innerHTML=DAYS.map((x,i)=>`<button class="${i===d?"on":""}" onclick="setDay(${i})">${x.tab.replace(" 周","<br>周")}</button>`).join("");
 let h=`<section class="dh"><h2>${D.tab} · ${esc(D.title)}</h2><div class="sum">${esc(D.sum)}</div><div class="meta"><span class="chip">🌇 日落 ≈${D.sun}</span><a class="chip" href="${D.wx}" target="_blank" rel="noopener">🌤 天气 · ${esc(D.wxl)} ↗</a><span class="chip">📍 ${esc(D.zn)}</span></div>${miniMap(d)}</section><div class="tl">`;
 L.forEach((e,i)=>{const p=P[e.p];const cur=r.d===d&&r.c===i;
  const body=e.card==="arrive"?arriveCard():`<div class="cd ${cur?"cur":""} ${e.opt?"opt":""}"><div class="nm"><span class="no" style="${e.p==="hotel"?"background:#334155":""}">${i+1}</span><span>${esc(nm(e))}${e.opt?' <span class="chip" style="font-weight:400;font-size:11px">可选</span>':""}</span></div>
   ${e.note?`<div class="nt">${esc(e.note)}</div>`:""}<div class="bdg">${e.alts?`<button class="alt" onclick="openSh(${d},${i})">${e.ai?"已替换 ▾":"可替换 ▾"}</button>`:""}${limHTML(d,e.lim)}</div>${bkHTML(e)}
   ${e.stops?`<ol class="stops">${e.stops.map(s=>`<li><a href="${gm(P[s])}" target="_blank" rel="noopener">${esc(P[s].n)}</a></li>`).join("")}</ol>`:""}${e.p!=="hotel"?moreHTML(p):""}</div>`;
  h+=`<div class="it" id="it-${i}"><div class="tm"><b>${e.t}</b>${e.e?`<span>– ${e.e}</span>`:""}</div>${body}</div>`;
  if(e.card==="airport")h+=`<div class="it"><div class="tm"><b>18:00</b><span>到羽田</span></div>${airportCard(d)}</div>`;
  h+=legHTML(legOf(d,i))});
 h+=`</div><details class="near" id="near"><summary>附近还有（${D.near.length}）· ${esc(D.zn)}</summary>${D.near.map(id=>{const p=P[id];return`<div class="ni"><span class="chip">${CI[p.c]||""}</span> <b>${esc(p.n)}</b>${p.pr?` · ${esc(p.pr)}`:""}<div style="color:#4b5563">${esc(p.d||"")}</div><a href="${gm(p)}" target="_blank" rel="noopener">Google Maps ↗</a>${p.acc?` <span style="color:#6b7280">· ${esc(p.acc.s)}${p.acc.m!=null?" 步行"+p.acc.m+"分":""}</span>`:""}</div>`}).join("")}</details>
 <div class="ft">≈ 为估算（路程、票价、坐标）。营业时间来自原攻略数据（核对于 2026-10-12）或你提供的信息，标注「你提供」「未核实」的请出发前再确认。地图底图：国土地理院。</div>`;
 $("#main").innerHTML=h;nowBar()}
render();setInterval(nowBar,30000);addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(render,200)});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js",{scope:"./"}).catch(()=>{}));
</script></body></html>
